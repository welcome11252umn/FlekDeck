name: Build iOS App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Build unsigned IPA
        run: |
          xcodebuild -project LiveContainer.xcodeproj \
            -scheme LiveContainer \
            -configuration Release \
            -derivedDataPath build \
            build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
          
          # Create IPA from build products
          mkdir -p Payload
          find build -name "LiveContainer.app" -type d -exec cp -r {} Payload/ \;
          zip -r output.ipa Payload/
          rm -rf Payload build

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LiveContainer-IPA
          path: output.ipa
