name: Build iOS App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Build and export IPA
        uses: yukiarrr/ios-build-action@v1.12.0
        with:
          project-path: LiveContainer.xcodeproj
          scheme: LiveContainer
          export-method: ad-hoc
          configuration: Release
          output-path: output.ipa
          
          # DIRECT REPOSITORY FILE PATHS
          p12-path: .github/certs/00008020-001234920188402E.p12
          p12-password: '1' # Replace with '1' or your custom password if '1234' fails
          mobileprovision-path: .github/certs/00008020-001234920188402E.mobileprovision
          
          # SECURE ENVIRONMENT STRINGS KEPT IN GITHUB SECRETS
          code-signing-identity: ${{ secrets.CODE_SIGNING_IDENTITY }}
          team-id: ${{ secrets.TEAM_ID }}

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LiveContainer-IPA
          path: output.ipa
