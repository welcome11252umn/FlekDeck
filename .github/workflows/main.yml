name: Build iOS App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Build and create IPA
        run: |
          # Create ad-hoc provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles/
          
          # Build with ad-hoc signing
          xcodebuild -project LiveContainer.xcodeproj \
            -scheme LiveContainer \
            -configuration Release \
            -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES
          
          # Find the app
          APP_PATH=$(find build -name "LiveContainer.app" -type d | head -1)
          
          # Create proper IPA structure
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/LiveContainer.app
          zip -r output.ipa Payload
          rm -rf Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LiveContainer-IPA
          path: output.ipa
