name: Build iOS App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Build and create IPA
        run: |
          # Build for iOS device
          xcodebuild -project LiveContainer.xcodeproj \
            -scheme LiveContainer \
            -configuration Release \
            -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
          
          # Find the app - check for any .app bundle
          APP_PATH=$(find build -name "*.app" -type d | head -1)
          
          if [ -z "$APP_PATH" ]; then
            echo "Error: No .app bundle found"
            find build -type d -name "*.app"
            exit 1
          fi
          
          echo "Found app at: $APP_PATH"
          
          # Create proper IPA structure
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r output.ipa Payload
          rm -rf Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LiveContainer-IPA
          path: output.ipa
